# Corrida diaria del robot del Mercurio (19 de Octubre de 2026). Ver servidor/diario.py.
# Intenta cada 20 minutos desde las 5:03 hasta las 7:05 de Chile. El primero que sale bien deja una marca
# en Supabase y los siguientes no hacen nada. Desde las 6:00 avisa una vez que todavía no hay informe.
# A las 7:05 (último intento) avisa cuántos intentos se hicieron y que no se intenta más.
# GitHub usa hora universal (UTC) y Chile cambia de hora (UTC-3 en verano, UTC-4 en invierno).
# Por eso los horarios cubren las dos horas y el primer paso se salta cualquier intento fuera de 5:00 a 7:10 de Chile.
# A mano (Run workflow) corre por defecto en modo ensayo, que manda el correo solo a CORREO_DIEGO.
# Despertador principal (19 de Octubre). cron-job.org llama a la API de GitHub (workflow_dispatch) con
# origen=automatico y modo=real en los mismos horarios. Esa corrida se trata igual que un horario de GitHub
# (ventana de 5:00 a 7:10 y último intento desde las 7:00). El horario de GitHub queda de respaldo, porque
# desde fines de Agosto de 2026 GitHub atrasa o no dispara los horarios en muchos repositorios.
name: Corrida diaria del Mercurio

on:
  schedule:
    # Verano (UTC-3) 5:03 5:23 5:43 6:03 6:23 6:43 7:05. Invierno (UTC-4) 5:03 5:23 5:43 6:05 6:25 6:45 7:05.
    - cron: "3,23,43 8,9 * * *"
    - cron: "5 10,11 * * *"
    - cron: "25,45 10 * * *"
  workflow_dispatch:
    inputs:
      modo:
        description: "ensayo (correo solo a Diego, guarda en pruebas/ensayo) o real (abogado y estado/)"
        required: true
        default: "ensayo"
        type: choice
        options: [ensayo, real]
      fecha:
        description: "Edición AAAA-MM-DD (vacío es hoy)"
        required: false
        default: ""
      origen:
        description: "manual (botón) o automatico (lo usa cron-job.org)"
        required: false
        default: "manual"
        type: choice
        options: [manual, automatico]

concurrency:
  group: corrida-diaria
  cancel-in-progress: false

jobs:
  diario:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      TZ: America/Santiago
      MODO: ${{ github.event_name == 'schedule' && 'real' || inputs.modo }}
      FECHA: ${{ inputs.fecha }}
      AUTOMATICO: ${{ (github.event_name == 'schedule' || inputs.origen == 'automatico') && 'si' || 'no' }}
      INTENTO_FINAL: ${{ (github.event_name == 'schedule' || inputs.origen == 'automatico') && '' || '1' }}
    steps:
      - name: Revisar la hora de Chile (fuera de 5:00 a 7:10 no se intenta)
        id: hora
        run: |
          hm=$(date +%H%M)
          echo "Hora de Chile $(date '+%H:%M')"
          echo "Origen ${{ github.event_name }} / ${{ inputs.origen }}. Automático $AUTOMATICO. Modo $MODO"
          if [ "$AUTOMATICO" = "si" ] && [ "$MODO" = "real" ] && { [ "$hm" -lt 0500 ] || [ "$hm" -gt 0710 ]; }; then
            echo "Fuera de la ventana. Este intento no hace nada."
            echo "seguir=no" >> "$GITHUB_OUTPUT"
          else
            echo "seguir=si" >> "$GITHUB_OUTPUT"
          fi

      - name: Bajar el código
        if: steps.hora.outputs.seguir == 'si'
        uses: actions/checkout@v4

      - name: Instalar Python 3.14
        if: steps.hora.outputs.seguir == 'si'
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"

      - name: Instalar librerías y el navegador Chromium
        if: steps.hora.outputs.seguir == 'si'
        run: |
          python -m pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      - name: Armar config.py desde la plantilla (las claves se leen de los secretos al correr)
        if: steps.hora.outputs.seguir == 'si'
        run: |
          cp config_template.py config.py
          cat >> config.py <<'PY'

          # Agregado por el servidor de GitHub. Los valores vienen de los secretos del repositorio.
          MERCURIO_USER = os.environ.get("MERCURIO_USER", "")
          MERCURIO_PASS = os.environ.get("MERCURIO_PASS", "")
          ANTHROPIC_API_KEY = os.environ.get("ANTHROPIC_API_KEY", "")
          PY

      - name: Corrida del día
        if: steps.hora.outputs.seguir == 'si'
        env:
          MERCURIO_USER: ${{ secrets.MERCURIO_USER }}
          MERCURIO_PASS: ${{ secrets.MERCURIO_PASS }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          CORREO_ABOGADO: ${{ secrets.CORREO_ABOGADO }}
          CORREO_DIEGO: ${{ secrets.CORREO_DIEGO }}
        run: python -m servidor.diario
